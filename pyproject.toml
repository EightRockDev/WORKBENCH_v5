[project]
name = "eight-rock-workbench"
version = "0.1.0"
description = "Eight Rock Capital Partners — multifamily underwriting workbench (Streamlit port of Workbench.html)."
requires-python = ">=3.11,<3.13"
dependencies = [
    "streamlit>=1.40",
    "pandas>=2.2",
    "numpy>=2.0",
    "numpy-financial>=1.0",
    "openpyxl>=3.1",
    # xlrd reads legacy .xls files — property-management systems still
    # export rent rolls in that format (see data/parsers.py).
    "xlrd>=2.0",
    "pydantic>=2.7",
    "python-docx>=1.1",
    # Artifact engine (LLM-powered analytical document generation —
    # exec summary, investor memos, value-add plan). Calls the Anthropic
    # API at generate time. Reads ANTHROPIC_API_KEY from env.
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    # --- Cloud / Microsoft 365 integration (added 2026-05-26 for Azure
    #     App Service deployment + Entra ID auth + Graph API access to the
    #     existing OneDrive Properties/ folder). All four are no-ops in
    #     local-dev mode (ER_STORAGE_BACKEND=local, ER_AUTH_BACKEND=disabled).
    "msal>=1.30",                       # Microsoft Authentication Library — Entra ID tokens (inactive in local mode)
    "azure-identity>=1.18",             # (inactive in local mode)
    "azure-storage-file-share>=12.18",  # (inactive in local mode)
    "requests>=2.32",                   # HTTP client for listings scraper + auth
    # --- Rent listings scraper (added 2026-05-26 to test from workbench tests/) ---
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    # --- Document ingestion (T-12 / rent roll / OM auto-extraction) ---
    "pypdf>=5.0",
    "xhtml2pdf>=0.2.17",
    # --- v5.0 pilot: PostgreSQL for multi-user concurrency (Section 9.3) and
    #     multi-tenant row-level security (Section 10.1). Inactive while the
    #     app runs on SQLite in local-dev; enabled once DATABASE_URL is set.
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live: tests that hit live external services (Apartments.com, etc.). Skip by default; run with `-m live`.",
]
